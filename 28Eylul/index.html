const urunleriGetir= async()=>{
    try{
        console.log("Harici apıye bağlanılıyor")
        const response=await fetch("https://dummyjson.com/products")
        if(!response.ok){
            throw new Error(`Http Hatası: ${response.status}`)
        }
        const data=await response.json()
        console.log(`Toplam ${data.products.lenght} adet ürün çekildi`)

        const vitrin=data.products.slice(2,7).map(p=>({
            urun:p.title,
            kategori:p.category,
            açıklama:p.description,
            fiyat:p.price,
            stok:p.stock,
            etiket:p.tags.join(", ")
        }))
        console.table(vitrin);

    }catch (err){
        console.warn("Api Hatası", err.message);
    }
}
urunleriGetir();
