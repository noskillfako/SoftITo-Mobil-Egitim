<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Klavye Değişkenleri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            bakckground-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h3>Mobil Klavye Değişkenleri</h3>
    <form id="mobileForm" autocomplete="on">
        <div class="form-group">
            <label for="name">Adınız:</label>
            <input type="text" id="name" name="name" placeholder="Furkan Çalışkan" 
            autocomplete="words" enterkeyhint="next">
            <div class="hint"> Her isim için baş harfi büyük olmalıdır.</div>
        </div>
        <div class="form-group">
            <label for="email">E-posta:</label>
            <input type="email" id="email" name="email" placeholder="furkan.caliskan@example.com" 
            autocomplete="none" enterkeyhint="next">
            <div class="hint"> Mail girilir</div>
        </div>
        <div class="form-group">
            <label for="kart">KrediKartıNumarası:</label>
            <input type="text" id="kart" name="kart" placeholder="**** **** **** 1234" 
            autocomplete="cc-number" enterkeyhint="next" inputmode="numeric" maxlength="19">
            <div class="hint"> Kredi kartı numarası girilir</div>
        </div>
        <div class="form-group">
            <label for="paratransfer">Para Transferi Tutarı:</label>
            <input type="text" id="paratransfer" name="paratransfer" placeholder="0,00" 
            autocomplete="off" enterkeyhint="done" inputmode="decimal">
            <div class="hint">Para transferi tutarı girilir</div>
        </div class="form-group">
            <label for="sms">SMS Kodu:</label>
            <input type="password" id="sms" name="sms" placeholder="********" 
            autocomplete="current-password" enterkeyhint="done">
            <div class="hint">SMS kodu girilir</div>

    </form>
    
    
</body>
</html>
