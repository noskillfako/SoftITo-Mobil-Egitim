<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Form ve Regex Doğrulama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: auto;
            padding: 20px;
            background-color: #f4f4f4;
            max-width: 450px;
        }
        .field{
            margin-bottom: 15px;
        }
        label{
            display :block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        form {
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:user-invalid{
            border-color: red;
            background-color: #ffe6e6;
        }
        input:valid{
            border-color: green;
            background-color: #e6ffe6;
        }
        .err{
            display: none;
            color: red;
            font-size: 12px;
            margin-top: 4px;
        }
        input:user-invalid + .err{
            display: block;
        }
        .hp-trap{
            display: none;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }
        </style>
</head>
<body>
    <h3>Kurumsal Üye Kaydı</h3>
    <form action="/kayıt" method="POST">
       <input type="text" name="bot_check" class="hp-trap" tabindex="-1"
       autocomplete="off">
       <div>
       <label for="tc">TC Kimlik Numarası:</label>
       <input type="text" id="tc" name="tc" pattern="^[1-9]{1}[0-9]{9}[02468]{1}$" required>
        <span class="err">Lütfen geçerli bir TC Kimlik Numarası girin (11 rakam).</span>
       </div>
       <div class="field">
            <label for="email">E-posta:</label>
            <input type="email" id="email" name="email" required>
            <span class="err">Lütfen geçerli bir e-posta adresi girin.</span>
        </div>
        <div class="field">
            <label for="tel">Telefon:</label>
            <input type="tel" id="tel" name="tel" pattern="(+90|0)?5[0-9]{2}[0-9]{3}[0-9]{2}[0-9]{2}$" required>
            <span class="err">Lütfen geçerli bir telefon numarası girin </span>
        </div>
        <div class="field">
            <label for="password">Şifre:</label>
            <input type="password" id="password" name="password" pattern="^(?=.[a-z])(?=.[A-Z])(?=.\d)(?=.[@$!%?&])[A-Za-z\d@$!%?&]{8,}$" required>
            <span class="err">Şifre en az 8 karakter olmalı ve en az bir harf ve bir rakam içermelidir.</span>
        </div>
        <button type="submit">Kaydol</button>
    </form>
</body>
</html>
