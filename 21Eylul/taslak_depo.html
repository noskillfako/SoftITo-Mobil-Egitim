<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Taslak ve Depolama</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1e293b;
            padding: 24px;
            max-width: 480px;
            margin: auto;
        }
        .card{
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0px 4px 12px -2px rgba(0,0,0,0.1);
            border: 1px solid #e2e2e2;
        }
        .form-group{
            margin-bottom: 18px;
        }
        label{
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        input, textarea{
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbcbcb;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea{
            resize: vertical;
            font-family: monospace;
        }
        .badge{
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            background: #dbeafe;
            color: #1d4ed8;
            margin-bottom: 14px;
        }
        h3{ margin-top: 0; }
        .btn-group{
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        button{
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-submit{
            background: #16a34a;
            color: white;
        }
        .btn-clear{
            background: #dc2626;
            color: white;
        }
        .status-msg{
            font-size: 13px;
            color: #10b891;
            margin-top: 8px;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class='card'>
        <span class="badge">Otomatik Offline Kayıt</span>
        <h3>Müşteri Arıza & Destek Kayıt Formu</h3>
        <p style="font-size: 12px;color: grey;margin-bottom: 12px;">Tarayıcıyı kapatsanız bile bunlar kayıt olarak kalacaktır</p>

        <form id="SupportForm">
            <div class="form-group">
                <label for="txtName">Müşteri Ad Soyad</label>
                <input type="text" id="txtName" name="name" placeholder="Ahmet Yılmaz">
            </div>
            <div class="form-group">
                <label for="txtDevice">Cihaz Modeli Seri No</label>
                <input type="text" id="txtDevice" name="device" placeholder="iPhone 15">
            </div>
            <div class="form-group">
                <label for="txtDesc">Arıza Detayı</label>
                <textarea id="txtDesc" name="desc" rows="4" placeholder="Arızayı detaylı açıklayın"></textarea>
            </div>
            <div class="status-msg" id="statusLog"></div>
            <div class="btn-group">
                <button type="submit" class="btn-submit">Kaydı Tamamla</button>
                <button type="button" id="btn-clear" class="btn-clear">Taslağı Sıfırla</button>
            </div>
        </form>
    </div>

    <script>
        const STORAGE_KEY = 'selahaddin_support_softito';
        const form = document.getElementById('SupportForm');
        const nameInput = document.getElementById('txtName');
        const deviceInput = document.getElementById('txtDevice');
        const descInput = document.getElementById('txtDesc');
        const statusLog = document.getElementById('statusLog');
        const btnClear = document.getElementById('btn-clear');

        // 1. Sayfa açıldığında localStorage'dan taslak geri gelir
        window.addEventListener('DOMContentLoaded', () => {
            const saveData = localStorage.getItem(STORAGE_KEY);
            if (saveData) {
                try {
                    const draft = JSON.parse(saveData);
                    nameInput.value = draft.name || "";
                    deviceInput.value = draft.device || "";
                    descInput.value = draft.desc || "";
                    statusLog.innerText = `Önceki taslak geri yüklendi (${draft.lastSaved})`;
                } catch (e) {
                    console.error("Taslak parse hatası:", e);
                }
            }
        });

        // 2. Formdaki her girişi JSON olarak localStorage'a yaz
        form.addEventListener('input', () => {
            const draftData = {
                name: nameInput.value,
                device: deviceInput.value,
                desc: descInput.value,
                lastSaved: new Date().toLocaleTimeString('tr-TR')
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(draftData));
            statusLog.innerText = `Taslak otomatik olarak kaydedildi: ${draftData.lastSaved}`;
        });

        // 3. Form gönderildiğinde başarı mesajı verip taslağı sil
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Destek talebiniz başarıyla iletildi');
            localStorage.removeItem(STORAGE_KEY);
            form.reset();
            statusLog.innerText = 'Form temizlendi, taslak silindi';
        });

        // 4. Taslağı manuel olarak temizleme
        btnClear.addEventListener('click', () => {
            if (confirm('Taslağı silmek istediğinizden emin misiniz?')) {
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
                statusLog.innerText = 'Taslak silindi';
            }
        });

        // 5. Çoklu sekme senkronizasyonu
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY && event.newValue) {
                const remoteDraft = JSON.parse(event.newValue);
                nameInput.value = remoteDraft.name || "";
                deviceInput.value = remoteDraft.device || "";
                descInput.value = remoteDraft.desc || "";
                statusLog.innerText = `Diğer sekmeden güncellendi: ${remoteDraft.lastSaved}`;
            }
        });
    </script>
</body>
</html>
