<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20px;
            max-width: 600;
            margin: auto;
        }
        .card{
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        h3{
            margin-top: 0;
            color: black;
        }
        iframe{
            width: 100%;
            border-radius: 8px;
            border: none;
        }

    </style>
</head>
<body>
    <div class="card">
        <h3>iFrame Harita ve Video</h3>
        <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/nvqh53Zgy9c?si=m093A64aqvLHHOw1" title="YouTube video player" frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12092.850213221403!2d31.541137256568543!3d40.735348251495935!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x409d3ff457bd525f%3A0x1bdf933512a72229!2s%C3%87ivril%2C%2014300%20Bolu%20Merkez%2FBolu!5e0!3m2!1str!2str!4v1789995747656!5m2!1str!2str" 
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
         referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</body>
</html>
