<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css pozisyonlama Mimarisi</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0 px;
        }
        body{
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: black;
            color: white;
            padding-bottom: 80px;
        }
        .mobilheader{
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 16px 20 px;
            border-bottom: 1px solid grey;
            font-weight: 700;
        }
        .feed{
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .product-card{
            position: relative;
            background: blueviolet;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid grey;
            padding: 20px;
        }
        .bagde-discount{
            position: absolute;
            top: 14px;
            right: 14px;
            background: red;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10 px;
            color: wheat;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0,5);
        }
        .bottom-nav{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100;
            height: 64px;
            background: grey;
            border-top: 1px solid;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }
        .fab-btn{
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: aquamarine;
            color: white;
            font-size: 24px;
            border: none;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 8px 24px;
        }
    </style>
</head>
<body>
    <header class="mobilheader">Keşfet & ALışveirş yap</header>
    <main class="feed">
        <div class="product-card">
            <span class="badge-discount">%40 indirim</span>
            <h3>Kablosuz Kulaklık</h3>
            <p style="color: white;margin: 8px 0 16px;">Aktif gürültü engelleme ve 100 saat şarj</p>
            <strong style="color: aqua;font-size: 20px;">1.500TL</strong>
        </div>
        <div class="product-card">
            <span class="badge-discount" style="background-color: blue;">Yeni</span>
            <h3>Akıllı Saat</h3>
            <p style="color: white;margin: 8px 0 16px;">Nabız ölçüm</p>
            <strong style="color: aqua;font-size: 20px;">1.400TL</strong>
        </div>
        <button class="fab-btn">+</button>
        <nav class="bottom-nav">
            <span>Anasayfa</span>
            <span>Arama</span>
            <span>Sepetim</span>
            <span>Profil</span>
        </nav>

    </main>
</body>
</html>
