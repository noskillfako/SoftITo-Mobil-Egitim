<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model ve taşma koruması</title>
    <style>
    *,*::before,*::after{
    box-sizing: border-box;
    margin: 0px;
    padding: 0px;
        }
    body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
    background-color: white;
    }
    .box-container{
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    }
    .broken-box{
    box-sizing: content-box;
    width: 100%;
    padding: 24px;
    border: 6px solid red;
    background-color: whitesmoke;
    margin-bottom: 30px;
    }

.fixed-box{
    box-sizing: border-box;
    width: 100%;
    padding: 24px;
    border: 6px solid green;
    background-color: aliceblue;
    border-radius: 12px;
}

.truncate-text{
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 250px;
    background: white;
    padding: 8px;
    border-radius: 6px;
    margin-top: 12px;
    border: 1px solid red;
}
</style>
</head>
<body>
    <div class="box-container">
        <h3>content box(taşma yapan eleman)</h3>
        <div class="broken-box">Ekrandan dışarı taşan kutu</div>
        <h3>Kusursuz kutumuz</h3>
        <div class="fixed-box">
            tam ekran sınırında kalan mobil dostu kutu
            <div class="truncate-text" title="bu çok uzun bir metin veya iban olabilir">
                dfsdfsfsdfdsfsdfdsfdsfsdfsdfdsfsdfdsfdsfdfgdgdfgdfgfgdf
            </div>
        </div>
    </div>
</body>
</html>
