<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet Balonu</title>
    <style>
        *,
        *::before,*::after{
    box-sizing: border-box;
    margin: 0;
    padding: 0px;
    }
        body{
    font-family:Verdana, Geneva, Tahoma, sans-serif;
    background: seagreen;
    padding: 20px;
    }
        .chat-row{
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: flex-end;
    }
        .avatar{
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: purple;
    color: wheat;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;

    }
        .outgoing-avatar{
    background: darkgoldenrod;
    }
    .message_content{
    background: white;
    padding: 12px 16px;
    border-radius: 16px 16px 16px 16px;
    max-width: 75%;
    box-shadow: 0 1px 3px;
    }
        .chat-row.outgoing{
    flex-direction: row-reverse;
    }
        .chat-row.outgoing .message_content{
    background: palevioletred;
    color: white;
    border-radius: 16px 16px 16px 16px;
    }
    </style>
</head>
<body>
    <div class="chat-row">
        <div class="avatar">AA</div>
        <div class="message_content">
            <strong>Ahmet Hoca:</strong>
            <p>Arkadaşlar flexbox mantığı kavrandı mı?</p>
        </div>
    </div>
    <div class="chat-row outgoing">
        <div class="avatar outgoing-avatar">FA</div>
        <div class="message_content">
            <p>Hocam ben anladım galiba</p>
        </div>
    </div>
</body>
</html>
