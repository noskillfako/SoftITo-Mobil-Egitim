<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Container</title>
   <style>
*,*::before,*::after{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
.chip-container{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
}
.chip{
    background-color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid red;
}
.card-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.card-title{
    font-size: 16px;
}
.last-login{
    color: blue;
}
.edit-button{
    background: cyan;
    color: wheat;
    border: none;
    padding: 8px;
    border-radius: 8px;
}</style>
</head>
<body>
    <h2>Mobil filtre(flex-wrap+gap)</h2>
    <div class="chip-container">
        <div class="chip">Akıllı Telefon</div>
        <div class="chip">Bilgisayar</div>
        <div class="chip">Akıllı Saat</div>
        <div class="chip">Oyun Konsolu</div>
        <div class="chip">Tablet</div>
    </div>

    <h2>Navigasyon Barı(space-between+align-items)</h2>
    <div class="card-header">
        <div>
            <h3 class="card-title">Kullanıcı Profili</h3>
            <p class="last-login">Son giriş bugun:12:44</p>
        </div>
        <button class="edit-button">Düzenle</button>
    </div>

</body>
</html>
